minimum_prek_version = "0.5.0"
default_install_hook_types = ["pre-commit", "pre-push", "commit-msg"]
default_stages = ["pre-commit"]

[[repos]]
repo = "builtin"
hooks = [
  { id = "check-added-large-files", args = ["--maxkb=1024"] },
  { id = "check-case-conflict" },
  { id = "check-illegal-windows-names" },
  { id = "check-merge-conflict" },
  { id = "check-symlinks" },
  { id = "check-toml" },
  { id = "check-json" },
  { id = "check-yaml" },
  { id = "detect-private-key" },
  { id = "check-executables-have-shebangs" },
  { id = "check-shebang-scripts-are-executable" },
  { id = "end-of-file-fixer", types = ["text"] },
  { id = "mixed-line-ending", args = ["--fix=no"], types = ["text"] },
  { id = "no-commit-to-branch", args = ["--branch", "main", "--branch", "develop"] },
  { id = "trailing-whitespace", types = ["text"] },
]

[[repos]]
repo = "https://github.com/rhysd/actionlint"
rev = "914e7df21a07ef503a81201c76d2b11c789d3fca" # v1.7.12
hooks = [
  { id = "actionlint", files = "^\\.github/workflows/" },
]

[[repos]]
repo = "https://github.com/compilerla/conventional-pre-commit"
rev = "91ab4bf57e58b32adf1a122681f6ebe164d081c8" # v4.4.0
hooks = [
  { id = "conventional-pre-commit", stages = ["commit-msg"] },
]

[[repos]]
repo = "local"
hooks = [
  { id = "cargo-fmt", name = "cargo fmt", entry = "cargo fmt --all -- --check", language = "system", pass_filenames = false, files = "(^|/)Cargo\\.(toml|lock)$|\\.rs$", stages = ["pre-commit"] },
  { id = "cargo-clippy", name = "cargo clippy", entry = "cargo clippy --workspace --all-targets --all-features --locked -- -D warnings", language = "system", pass_filenames = false, files = "(^|/)Cargo\\.(toml|lock)$|\\.rs$", stages = ["pre-commit"] },
  { id = "cargo-test", name = "cargo test", entry = "cargo test --workspace --all-targets --all-features --locked", language = "system", pass_filenames = false, always_run = true, stages = ["pre-push"] },
]
