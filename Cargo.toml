[package]
name = "geekmagic-custom-monitor-rs"
version = "0.2.3"
description = "Extensible Rust monitors for GeekMagic SmallTV displays"
edition = "2024"

[dependencies]
anyhow = "1.0"
image = "0.25"
imageproc = "0.26"
ab_glyph = "0.2"
reqwest = { version = "0.13", features = ["blocking", "form", "json", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.36"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock", "serde"] }
toml = "1"
log = "0.4"
# No default features: env_logger's timestamp support pulls in `jiff`, and this
# crate formats timestamps with the `chrono` dependency above.
env_logger = { version = "0.11", default-features = false, features = [
    "auto-color",
    "regex",
] }

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "geekmagic-monitors"
path = "src/main.rs"
