[package]
name = "geekmagic-custom-monitor-rs"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0"
image = "0.25"
imageproc = "0.26"
ab_glyph = "0.2"
reqwest = { version = "0.13", features = ["blocking", "form", "multipart"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sysinfo = "0.36"
clap = { version = "4", features = ["derive"] }
chrono = { version = "0.4", features = ["clock"] }
claude-code-stats = "0.1.0"
toml = "1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
windows-sys = { version = "0.61", features = ["Win32_Storage_FileSystem"] }

[[bin]]
name = "geekmagic-monitors"
path = "src/main.rs"
