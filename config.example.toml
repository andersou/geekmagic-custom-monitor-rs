host = "192.168.1.201"
model = "auto"             # auto | ultra | pro
interval = 300             # omit for one-shot
parallel_render = true
autoplay_interval = 10
image_mode = "append"    # append | only-stats (only-stats deletes non-app images, with local backup)
backup_retention = 5   # number of backup directories kept

[plugins.claude]
enabled = true

[plugins.disk]
enabled = true

[plugins.kimi]
enabled = true
# api_key = "sk-kimi-..."   # optional: else KIMI_CODE_API_KEY, KIMI_API_KEY, or a Kimi Code CLI login

# renderer plugins (always available, not toggleable): agents-usage-ui
